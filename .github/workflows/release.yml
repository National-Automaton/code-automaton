name: Release

# Stage a release on npm when a version tag is pushed, then approve it by hand.
#
# Staged publishing defers proof-of-presence (2FA) to the approval step, so the
# CI token never needs a publish-bypass. That matters because npm is removing
# 2FA-bypass tokens for direct publishing in January 2027; this flow does not
# depend on them. CI still gets to run the build and attach provenance, and the
# actual publish stays gated on a human with an authenticator.
#
# One-time setup:
#   1. Create the NPM_TOKEN secret: a granular access token with read/write on
#      this package. It does NOT need "bypass 2FA" -- staging is not gated on it.
#   2. Settings -> Actions -> General -> Workflow permissions: allow read/write.
#
# To release: bump the version, land the bump on main via PR, THEN push the tag.
# main is protected, so a direct push is rejected -- and a tag pushed before the
# bump is merged points at a commit that is not on the branch, so the staging
# run and the branch disagree.
#   npm version patch                     # commits + tags locally
#   git switch -c chore/release-<ver> && git push -u origin chore/release-<ver>
#   gh pr create --fill && gh pr merge --merge   # merge, do NOT squash
#   git switch main && git pull --ff-only
#   git push origin v<ver>                # tag's commit is now on main
# Squashing the PR rewrites the commit the local tag points at, so a squash
# merge would leave the tag on an orphaned commit. Use a merge commit.
# CI stages it. Then approve the staged version in the npm web UI (account ->
# Staged packages); that step is the 2FA proof-of-presence, so it stays manual.
# Approving via CLI also works (`npm stage approve <stage-id>`) but is not
# required.
#
# After approving, mark the GitHub release Latest:
#   gh release edit <tag> --latest
# The release is created below with --latest=false, because a staged version is
# not installable yet and "Latest" should track what npm actually serves.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  id-token: write # required for provenance

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the release notes are generated against the
      # previous tag, which `git describe --tags` cannot see in the default
      # single-commit checkout -- it would silently fall back to no range and
      # list every PR ever merged.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # actions/setup-node bundles whatever npm came with the Node release,
      # and Node 22 ships npm 10 -- which has no `npm stage` subcommand. Install
      # a current npm explicitly rather than depending on the bundled one.
      - name: Update npm
        run: npm install -g npm@11

      - name: Show versions
        run: node --version && npm --version

      # `npm ci` runs the `prepare` script, which builds dist/. The published
      # package ships dist/ rather than src/, so a stale build would stage code
      # that does not match the tag.
      - run: npm ci

      # The tag is cut from whatever `main` the releaser has locally, which is
      # not necessarily the one CI saw -- pushing from a stale checkout stages a
      # commit whose tests were never run. Repeat the gates here so the tag is
      # refused rather than the tarball being wrong.
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      # Guard against staging a tag that does not match package.json: the tag is
      # the source of truth for what users will download.
      - name: Verify tag matches package.json
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json (${PKG_VERSION})"
            exit 1
          fi

      - name: Smoke test the built artifact
        run: |
          node dist/index.js --version
          # The published tarball must contain the compiled output.
          npm pack --dry-run 2>&1 | grep -q "dist/index.js"

      # Staged, not published: this lands in npm's staging area and waits for a
      # human to approve it. Provenance is attached here, at build time.
      # Staging fails with E409 if the version is already staged or published.
      # That is easy to hit: re-running after a cancel or a transient failure,
      # or cancelling just after the stage request lands. The public registry
      # cannot answer this question -- a staged version is not served from
      # registry.npmjs.org and returns 404 there -- so `npm stage list` is the
      # only reliable check. Querying the registry instead is what led to a
      # cancelled run's version being reported as "not staged", only for the
      # next run to fail on E409.
      - name: Stage the release
        run: |
          set -o pipefail
          VERSION="$(node -p "require('./package.json').version")"
          VESC="$(printf '%s' "$VERSION" | sed 's/\./\\./g')"

          # `npm stage list` takes a package NAME, not a version range:
          #   npm stage list code-automaton          -> valid
          #   npm stage list code-automaton@1.4.2    -> EUSAGE
          # Passing a version made every run warn and fail open, so the dedupe
          # below never actually ran.
          if npm stage list code-automaton > /tmp/staged.txt 2>/tmp/staged.err; then
            # Whole-version match: 1.4.1 must not match 1.4.10 or 1.4.1-beta1.
            if grep -qE "(^|[^0-9A-Za-z.-])${VESC}([^0-9A-Za-z.-]|$)" /tmp/staged.txt; then
              echo "::notice::code-automaton@${VERSION} is already staged; skipping. Approve it in the npm web UI."
              exit 0
            fi
          else
            # A usage error means the command's interface changed under us, so
            # the check is no longer doing its job. Say so loudly rather than
            # degrading to a warning nobody reads. Anything else (auth, network)
            # is expected to be transient: warn and stage anyway, because
            # skipping a genuine first-time stage would be worse.
            if grep -qE "EUSAGE" /tmp/staged.err; then
              echo "::error::'npm stage list' rejected its arguments; the dedupe check did not run"
              tail -5 /tmp/staged.err | sed 's/^/  /'
              exit 1
            fi
            echo "::warning::could not list staged versions; attempting to stage anyway"
            tail -5 /tmp/staged.err | sed 's/^/  /'
          fi

          npm stage publish . --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create the release here rather than by hand. Pushing a tag does not
      # create a release, so doing it manually means it silently drifts out of
      # date -- 1.1.0 and 1.2.0 shipped with no release page until it was
      # noticed. The release is marked as not-latest because the version is
      # still staged; npm only makes it installable after approval.
      - name: Create GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The body is built here rather than by `gh release create
          # --generate-notes` for two reasons, both of which needed a manual
          # edit on every past release:
          #
          #   - `--notes` is prepended to the generated body, so the staging
          #     instructions ("Approve it in the npm web UI...") were published
          #     on the release page. They are for whoever cuts the release and
          #     are emitted as a run annotation by the step below instead.
          #
          #   - The generated range starts at the previous tag, and the previous
          #     release's own version-bump PR merges *after* that tag. So every
          #     release listed the last one: 1.9.0's notes began
          #     "1.8.0 by @... in #38", and 1.10.0's would begin "1.9.0 ... #41".
          #
          # A bump PR is titled with just the version number, which makes it
          # identifiable and safe to drop: a normal PR says what it changes.
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            BODY=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" \
              -f previous_tag_name="${PREVIOUS_TAG}" \
              --jq .body)
          else
            BODY=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" \
              --jq .body)
          fi

          # Drop the version-bump bullets. A generated bullet looks like
          #   * 1.9.0 by @user in https://github.com/o/r/pull/41
          # so the title is matched between "* " and " by @".
          BODY=$(printf '%s\n' "$BODY" \
            | grep -vE '^\* [0-9]+\.[0-9]+\.[0-9]+ by @' || true)

          # Trim the blank lines the removal leaves behind.
          BODY=$(printf '%s\n' "$BODY" | sed '/./,$!d')

          # State plainly where the package lives. Dropping the old sentence was
          # an overcorrection: the problem was never mentioning npm, it was the
          # instructional tone aimed at whoever cut the release ("Approve it in
          # the npm web UI", "mark this release Latest with gh release edit ...").
          # Those are emitted as a run annotation below; this line is for readers.
          PKG_NAME=$(node -p "require('./package.json').name")
          NPM_NOTE=$(printf '_Published on npm as `%s@%s`._' "$PKG_NAME" "${GITHUB_REF_NAME#v}")

          # The note goes straight after the heading so it reads first, rather
          # than trailing the changelog where it would be missed.
          # `sed 1a` inserts after the heading line; the blank line that follows
          # keeps the note clear of the first changelog entry.
          printf '%s\n' "$BODY" \
            | sed "1a\\\n${NPM_NOTE}\\n" \
            > /tmp/release-notes.md

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            --latest=false

      - name: Note that approval is manual
        if: success()
        run: |
          echo "::notice::Staged ${GITHUB_REF_NAME}. Approve it in the npm web UI, then: gh release edit ${GITHUB_REF_NAME} --latest"
